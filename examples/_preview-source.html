<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cc-resume layout preview</title>
  <style>
    @font-face { font-family: "Noto Sans SC"; src: url("../fonts/noto-sans-sc-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Noto Sans SC"; src: url("../fonts/noto-sans-sc-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Noto Sans SC"; src: url("../fonts/noto-sans-sc-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Noto Sans SC"; src: url("../fonts/noto-sans-sc-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "IBM Plex Sans"; src: url("../fonts/ibm-plex-sans-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "IBM Plex Sans"; src: url("../fonts/ibm-plex-sans-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "IBM Plex Sans"; src: url("../fonts/ibm-plex-sans-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "IBM Plex Sans"; src: url("../fonts/ibm-plex-sans-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Newsreader"; src: url("../fonts/newsreader-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Newsreader"; src: url("../fonts/newsreader-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
    @font-face { font-family: "Newsreader"; src: url("../fonts/newsreader-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }

    :root {
      --accent:      #003891;
      --accent-deep: #002664;
      --tag-bg:      #eef2f9;
      --redact:      #c8c8c8;
      --redact-strong: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 10.5pt;
      color: #222;
      background: #f0f0f0;
      padding: 24px 0 40px;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      background: #fff; margin: 0 auto;
      box-shadow: 0 2px 16px rgba(0,0,0,0.13);
      border-top: 4px solid var(--accent);
      padding-bottom: 14px;
    }

    /* Redaction blocks */
    .r {
      display: inline-block;
      vertical-align: -1px;
      background: var(--redact);
      border-radius: 2px;
      height: 0.85em;
      margin: 0 1px;
    }
    .r-strong { background: var(--redact-strong); }
    .r-2  { width: 1.2em; } .r-3  { width: 1.8em; } .r-4  { width: 2.4em; }
    .r-6  { width: 3.6em; } .r-8  { width: 4.8em; } .r-10 { width: 6em;   }
    .r-12 { width: 7.2em; } .r-14 { width: 8.4em; } .r-16 { width: 9.6em; }
    .r-20 { width: 12em;  } .r-24 { width: 14.4em;} .r-28 { width: 16.8em;}
    .r-32 { width: 19.2em;} .r-36 { width: 21.6em;}

    .header {
      display: flex; align-items: center; gap: 16px;
      padding: 8px 28px 7px;
      background: #f8f9fb;
      border-bottom: 1px solid #e5e7eb;
    }
    .header-photo {
      width: 76px; height: 104px;
      border: 1px solid #d1d5db;
      flex-shrink: 0;
      background: linear-gradient(135deg, #d1d5db 0%, #e5e7eb 100%);
    }
    .header-info { flex: 1; }
    .header-track { font-size: 8.5pt; letter-spacing: 0.18em; color: #6b7280; text-transform: uppercase; margin-bottom: 4px; }
    .header-name {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px;
      height: 24pt;
    }
    .header-name .r {
      height: 18pt;
      width: 1.4em;
      background: #2a2a2a;
      border-radius: 3px;
    }
    .header-basic { font-size: 10pt; color: #6b7280; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
    .header-basic .sep { color: var(--accent); }
    .header-contacts { display: flex; gap: 10px; flex-wrap: wrap; }
    .contact-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 9.5pt; color: #374151;
      border: 1px solid #d1d5db; border-radius: 4px;
      padding: 2px 8px; background: #fff;
    }

    .content { padding: 12px 32px 14px; }
    .section { margin-bottom: 8px; }
    .section-title {
      display: flex; align-items: center; gap: 7px;
      font-size: 11.5pt; font-weight: 700;
      color: var(--accent-deep);
      border-bottom: 1.5px solid var(--accent);
      padding-bottom: 3px; margin-bottom: 6px;
      letter-spacing: 0.06em;
    }

    .edu-row {
      display: flex; align-items: center;
      margin-bottom: 4px;
      height: 14pt;
    }
    .edu-school { font-weight: 600; width: 200px; flex-shrink: 0; color: #111; font-size: 10pt; display: flex; align-items: center; gap: 4px; }
    .edu-degree { color: #6b7280; flex: 1; font-size: 9.5pt; display: flex; align-items: center; gap: 4px; }
    .edu-date   { color: #9ca3af; font-size: 8.5pt; text-align: right; white-space: nowrap; display: flex; align-items: center; gap: 3px; justify-content: flex-end; }
    .edu-meta {
      font-size: 9.5pt; color: #374151;
      line-height: 1.85; margin-top: 6px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    }

    .entry { margin-bottom: 7px; }
    .entry-header {
      display: flex; align-items: center; gap: 9px;
      margin-bottom: 3px;
      height: 14pt;
    }
    .entry-logo {
      width: 18px; height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--accent);
      opacity: 0.65;
    }
    .entry-company { font-weight: 700; font-size: 10.5pt; color: #111; display: flex; gap: 4px; align-items: center; }
    .entry-role    { color: #6b7280; flex: 1; text-align: center; font-size: 9.5pt; display: flex; gap: 4px; align-items: center; justify-content: center; }
    .entry-date    { color: #9ca3af; font-size: 8.5pt; display: flex; gap: 3px; align-items: center; }
    .entry-desc    { font-size: 9.5pt; color: #374151; line-height: 1.7; margin: 3px 0 4px 27px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

    .entry-bullets { margin: 0 0 0 27px; padding-left: 0; list-style: none; }
    .entry-bullets li {
      position: relative;
      font-size: 9.5pt; line-height: 1.7;
      margin-bottom: 2px; padding-left: 16px;
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }
    .entry-bullets li::before {
      content: ""; position: absolute;
      left: 1px; top: 0.65em;
      width: 6px; height: 6px;
      background: var(--accent);
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    .sub-heading {
      position: relative;
      font-size: 9.5pt; font-weight: 600;
      color: #374151;
      margin: 4px 0 2px 27px;
      padding-left: 11px;
      display: flex; gap: 4px; align-items: center;
      height: 14pt;
    }
    .sub-heading::before {
      content: ""; position: absolute;
      left: 0; top: 0.18em; bottom: 0.22em;
      width: 3px;
      background: var(--accent);
      border-radius: 1.5px;
    }

    .paper-cite {
      font-size: 8.5pt; line-height: 1.6;
      margin: 3px 0 4px 27px;
      padding: 5px 10px;
      background: #fafafa;
      border-left: 2px solid var(--accent);
      font-family: "Newsreader", serif;
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }

    .award-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 24px; }
    .award-item {
      font-size: 9.5pt; color: #374151;
      line-height: 1.7;
      display: flex; gap: 6px; align-items: center;
    }
    .award-item::before { content: "▸"; color: var(--accent); flex-shrink: 0; font-size: 9pt; }
    .award-tag-block {
      display: inline-block;
      background: var(--tag-bg);
      width: 2.4em; height: 0.95em;
      border-radius: 3px; margin: 0 2px;
    }

    .statement {
      font-size: 10pt; line-height: 1.75;
      padding: 7px 13px;
      background: #fafafa;
      border-left: 3px solid var(--accent);
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }

    @page { size: A4; margin: 0; }
  </style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-photo"></div>
    <div class="header-info">
      <div class="header-track">▒▒▒▒▒▒▒▒▒▒ / ▒▒▒▒▒▒▒▒▒▒ / ▒▒▒▒▒▒▒▒▒▒</div>
      <div class="header-name">
        <span class="r"></span><span class="r"></span><span class="r"></span>

        <span class="r r-2"></span><span class="sep">·</span>

      <div class="header-contacts">

          <span class="r r-10"></span>
        </span>
        <span class="contact-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
          <span class="r r-14"></span>
        </span>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="section">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3.5 2 8.5 2 12 0v-5"/></svg>

      </div>
      <div class="edu-row">
        <span class="edu-school"><span class="r r-8 r-strong"></span><span class="r r-3"></span></span>
        <span class="edu-degree"><span class="r r-12"></span> · <span class="r r-10"></span></span>
        <span class="edu-date"><span class="r r-6"></span> - <span class="r r-3"></span></span>
      </div>
      <div class="edu-row">
        <span class="edu-school"><span class="r r-8 r-strong"></span><span class="r r-3"></span></span>
        <span class="edu-degree"><span class="r r-10"></span> · <span class="r r-12"></span></span>
        <span class="edu-date"><span class="r r-6"></span> - <span class="r r-6"></span></span>
      </div>
      <div class="edu-row">
        <span class="edu-school"><span class="r r-10 r-strong"></span><span class="r r-3"></span></span>
        <span class="edu-degree"><span class="r r-8"></span> · <span class="r r-10"></span></span>
        <span class="edu-date"><span class="r r-6"></span> - <span class="r r-6"></span></span>
      </div>
      <div class="edu-meta">
        <span class="r r-4 r-strong"></span>
        <span class="r r-6"></span>·<span class="r r-6"></span>·<span class="r r-4"></span>·<span class="r r-6"></span>·<span class="r r-8"></span>·<span class="r r-4"></span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        实习经历
      </div>

      <div class="entry">
        <div class="entry-header">
          <span class="entry-logo"></span>
          <span class="entry-company"><span class="r r-12 r-strong"></span></span>
          <span class="entry-role"><span class="r r-8"></span> · <span class="r r-6"></span></span>
          <span class="entry-date"><span class="r r-6"></span> - <span class="r r-6"></span></span>

        <div class="sub-heading"><span class="r r-16 r-strong"></span></div>
        <ul class="entry-bullets">
          <li><span class="r r-6 r-strong"></span><span class="r r-32"></span><span class="r r-24"></span><span class="r r-12"></span></li>
          <li><span class="r r-8 r-strong"></span><span class="r r-28"></span><span class="r r-20"></span><span class="r r-16"></span></li>
          <li><span class="r r-10 r-strong"></span><span class="r r-24"></span><span class="r r-14"></span></li>
        </ul>

        <div class="sub-heading"><span class="r r-14 r-strong"></span></div>
        <ul class="entry-bullets">
          <li><span class="r r-6 r-strong"></span><span class="r r-20"></span><span class="r r-16"></span><span class="r r-10"></span></li>
          <li><span class="r r-10 r-strong"></span><span class="r r-24"></span><span class="r r-14"></span></li>
          <li><span class="r r-10"></span><span class="r r-20"></span><span class="r r-12"></span></li>
          <li><span class="r r-24 r-strong"></span></li>
        </ul>
      </div>

      <div class="entry">
        <div class="entry-header">
          <span class="entry-logo"></span>
          <span class="entry-company"><span class="r r-10 r-strong"></span></span>
          <span class="entry-role"><span class="r r-8"></span> · <span class="r r-6"></span></span>
          <span class="entry-date"><span class="r r-6"></span> - <span class="r r-3"></span></span>
        </div>
        <div class="entry-desc"><span class="r r-12 r-strong"></span><span class="r r-20"></span><span class="r r-16 r-strong"></span><span class="r r-10"></span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M9 2v6L4 14v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6l-5-6V2"/><line x1="9" y1="2" x2="15" y2="2"/></svg>
        科研经历
      </div>

      <div class="entry">
        <div class="entry-header">
          <span class="entry-logo"></span>
          <span class="entry-company"><span class="r r-14 r-strong"></span></span>
          <span class="entry-role"><span class="r r-8"></span> · <span class="r r-12"></span></span>

      </div>

      <div class="entry">
        <div class="entry-header">
          <span class="entry-logo"></span>
          <span class="entry-company"><span class="r r-16 r-strong"></span></span>
          <span class="entry-role"><span class="r r-8"></span> · <span class="r r-10"></span></span>

        <ul class="entry-bullets">
          <li><span class="r r-12 r-strong"></span><span class="r r-16"></span><span class="r r-10 r-strong"></span><span class="r r-12"></span></li>
        </ul>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6m12 0h1.5a2.5 2.5 0 0 1 0 5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22m10 0c0-1.76-.85-3.25-2.03-3.79-.5-.23-.97-.66-.97-1.21v-2.34M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>

      <div class="award-grid">

    <div class="section" style="margin-bottom:0;">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
